
# 数据库配置
# engine: sqlite / mysql / pgsql
database:
  engine: sqlite
  # SQLite 配置（engine=sqlite 时生效）
  name: db.sqlite3
  # MySQL / PostgreSQL 配置（engine=mysql 或 pgsql 时生效）
  host: 127.0.0.1
  port: 3306
  user: root
  password: ''
  db_name: onii

es:
  host: localhost
  port: 9200

log:
  path: ./logs
  default: app_all.log
  error: app_error.log
  level: INFO
  maxBytes: 100000000  # 100mb
  backupCount: 10

# 安全配置
security:
  ip_whitelist_enabled: false
  ip_whitelist:
    - 127.0.0.1
    - 192.168.0.0/16
    - 10.0.0.0/8
  # API 签名验证
  api_sign_enabled: false
  api_sign_secret: 'prod-hmac-secret-CHANGE-THIS'
  # 密码历史记录数
  password_history_count: 5
  # 最大同时在线设备数
  max_sessions: 3

# CORS 跨域配置
cors:
  allow_all: false
  allow_credentials: true
  allowed_origins:
    - https://your-domain.com